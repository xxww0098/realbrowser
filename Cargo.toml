[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/browser-control",
  "crates/browser-core",
  "crates/browser-network",
  "crates/browser-platform",
  "crates/browser-persona",
  "crates/browser-persona-runtime",
  "crates/browser-profile",
  "crates/browser-storage",
  "tools/xtask",
]
default-members = [
  "apps/desktop/src-tauri",
  "crates/browser-control",
  "crates/browser-core",
  "crates/browser-network",
  "crates/browser-platform",
  "crates/browser-persona",
  "crates/browser-persona-runtime",
  "crates/browser-profile",
  "crates/browser-storage",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Proprietary"

[workspace.dependencies]
browser-control = { path = "crates/browser-control" }
browser-core = { path = "crates/browser-core" }
browser-network = { path = "crates/browser-network" }
browser-platform = { path = "crates/browser-platform" }
browser-persona = { path = "crates/browser-persona" }
browser-persona-runtime = { path = "crates/browser-persona-runtime" }
browser-profile = { path = "crates/browser-profile" }
browser-storage = { path = "crates/browser-storage" }
blake3 = "1.8.2"
cargo_metadata = "0.23.1"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", default-features = false, features = ["process"] }
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.151"
sha2 = "0.10.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tauri-build = "2.6.3"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
tungstenite = { version = "0.30.0", default-features = false }
url = "2.5.8"
uuid = { version = "1.24.1", default-features = false }
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.fast]
inherits = "dev"
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.ci]
inherits = "dev"
incremental = false
debug = 0
